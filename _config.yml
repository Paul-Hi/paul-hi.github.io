url: "https://paulhi.github.io"
baseurl: ""
title: "Paul Himmler"
email: your-email@example.com
description: "Paul Himmler Portfolio Website"
baseurl: ""
destination: docs/
exclude:
  - Makefile
  - context.md
  - planning/
  - AGENTS.md
  - CLAUDE.md
  - .agent/
  - .claude/
  - .codegraph/
  - .serena/
  - .scratch/

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

